<script>
/* =========================================================

   publishable(anon) 키는 브라우저에서 쓰는 공개용 키이며,
   데이터 보호는 Supabase의 RLS 정책으로 합니다 (schema.sql 참고).
   ========================================================= */
const DEFAULT_SB_URL = 'https://jgvikmakenpllwxwdugk.supabase.co';
const DEFAULT_SB_KEY = 'sb_publishable_sKp-6nz2PQ9LxQ5pF-nYkg_YwoEJN6S';
const TABLE = 'trip_docs';
/* schema.sql 과 같은 내용 — [설정] 탭에 표시 */
const SCHEMA_SQL = `-- 출장등록 저장용 테이블 (개인용: 로그인 없이 사용)
-- Supabase 대시보드 > SQL Editor 에 붙여넣고 한 번 실행하세요. 다시 실행해도 데이터는 지워지지 않습니다.

create table if not exists public.trip_docs (
  id          uuid primary key default gen_random_uuid(),
  title       text not null default '',
  data        jsonb not null default '{}'::jsonb,
  created_at  timestamptz not null default now(),
  updated_at  timestamptz not null default now()
);

create index if not exists trip_docs_updated_at_idx on public.trip_docs (updated_at desc);

alter table public.trip_docs enable row level security;

drop policy if exists "trip_docs anon select" on public.trip_docs;
drop policy if exists "trip_docs anon insert" on public.trip_docs;
drop policy if exists "trip_docs anon update" on public.trip_docs;
drop policy if exists "trip_docs anon delete" on public.trip_docs;

create policy "trip_docs anon select" on public.trip_docs for select to anon using (true);
create policy "trip_docs anon insert" on public.trip_docs for insert to anon with check (true);
create policy "trip_docs anon update" on public.trip_docs for update to anon using (true) with check (true);
create policy "trip_docs anon delete" on public.trip_docs for delete to anon using (true);

/* ---------------- 편집기 ---------------- */
function fld(label, path, type) {
  const v = getPath(path);
  if (type === 'area') return `<div class="field"><label>${label}</label><textarea data-path="${path}">${esc(v)}</textarea></div>`;
  return `<div class="field"><label>${label}</label><input type="${type || 'text'}" data-path="${path}" value="${esc(v)}"></div>`;
}
function keywordCheck(key) {
  if (!DOCS[key] || key === 'exp' || key === 'photos') return '';
  const ok = DOCS[key].text().includes(KEYWORD);
  return ok ? `<div class="okbox">‘${KEYWORD}’ 문구가 들어 있습니다.</div>`
            : `<div class="warnbox">‘${KEYWORD}’ 문구가 없습니다. 증빙 요건상 반드시 넣어야 합니다.</div>`;
}

/* =====================================================================

function isoLocal(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
function fmtShot(iso) { if (!iso) return ''; const [d, t] = iso.split('T'); const [, m, dd] = d.split('-'); return `${m}.${dd} ${(t || '').slice(0, 5)}`; }

/* ---------- 위치 ---------- */
function startGeo() {
  if (geo.watching) return;
  if (!navigator.geolocation) { geo.err = '이 브라우저는 위치 기능을 지원하지 않습니다'; return; }
  geo.watching = true;
  navigator.geolocation.watchPosition(pos => {
    geo.fix = { lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy), t: Date.now() };
    geo.err = ''; updateGeoChip(); fillPendingLocations();
  }, e => { geo.err = e.code === 1 ? '위치 권한이 거부됨 (브라우저 주소창에서 허용)' : '위치를 찾지 못함'; updateGeoChip(); },
  { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}
function geoChipHtml() {
  const f = geo.fix;
  const fresh = f && Date.now() - f.t < 120000;
  const cls = fresh ? 'ok' : (geo.err ? 'err' : '');
  const txt = fresh ? `위치 수신 중 ±${f.acc}m` : (geo.err || '위치 찾는 중…');
  return `<span class="geo-chip status ${cls}" data-geo-chip>${esc(txt)}</span>`;
}
function updateGeoChip() { document.querySelectorAll('[data-geo-chip]').forEach(el => { el.outerHTML = geoChipHtml(); }); }
/* 막 찍은 사진에 위치를 붙임. 아직 위치가 없으면 '대기'로 두었다가 2분 안에 잡히면 채움 */
function applyGeo(p) {
  const f = geo.fix;
  if (f && Date.now() - f.t < 120000) Object.assign(p, { lat: f.lat, lng: f.lng, acc: f.acc, locSrc: 'gps' });
  else { p.locSrc = 'pending'; p.pendingAt = Date.now(); }
}
function fillPendingLocations() {
  let changed = false;
  photos().forEach(p => {
    if (p.locSrc === 'pending' && Date.now() - (p.pendingAt || 0) < 120000 && geo.fix) {
      Object.assign(p, { lat: geo.fix.lat, lng: geo.fix.lng, acc: geo.fix.acc, locSrc: 'gps' }); delete p.pendingAt; changed = true;
    }
  });
  if (changed) { markDirty(); if (currentTab === 'photos') renderAll(); }
}

/* ---------- 압축: 가운데 16:9 자르기 → JPEG 50KB 이하 ---------- */
function canvasToBlob(c, q) { return new Promise(r => c.toBlob(r, 'image/jpeg', q)); }
function blobToDataURL(b) { return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); }
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function compress169(src, sw, sh) {
  let cw = sw, ch = Math.round(sw * 9 / 16);
  if (ch > sh) { ch = sh; cw = Math.round(sh * 16 / 9); }
  const cx = Math.round((sw - cw) / 2), cy = Math.round((sh - ch) / 2);
  const c = document.createElement('canvas'), g = c.getContext('2d');
  let best = null;
  for (const W of [960, 848, 720, 640, 560, 480, 400, 320]) {
    const w = Math.min(W, cw), h = Math.round(w * 9 / 16);
    c.width = w; c.height = h; g.imageSmoothingQuality = 'high';
    g.drawImage(src, cx, cy, cw, ch, 0, 0, w, h);
    for (const q of [0.7, 0.58, 0.46, 0.36]) {
      const b = await canvasToBlob(c, q);
      best = { blob: b, w, h };
      if (b.size <= PHOTO_MAX) return best;
    }
  }
  return best;
}

/* ---------- EXIF: 촬영시각 + GPS (JPEG) ---------- */
function readExif(buf) {
  const v = new DataView(buf);
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  let off = 2;
  while (off + 10 < v.byteLength) {
    const mk = v.getUint16(off), size = v.getUint16(off + 2);
    if ((mk & 0xFF00) !== 0xFF00) break;
    if (mk === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) return parseTiff(v, off + 10);
    if (mk === 0xFFDA) break;
    off += 2 + size;
  }
  return null;
}
function parseTiff(v, t) {
  const le = v.getUint16(t) === 0x4949;
  const u16 = o => v.getUint16(t + o, le), u32 = o => v.getUint32(t + o, le);
  const ifd = o => { const n = u16(o), tags = {}; for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; tags[u16(e)] = { count: u32(e + 4), at: e + 8 }; } return tags; };
  const str = tg => { const o = tg.count > 4 ? u32(tg.at) : tg.at; let s = ''; for (let i = 0; i < tg.count - 1; i++) s += String.fromCharCode(v.getUint8(t + o + i)); return s; };
  const rats = tg => { const o = u32(tg.at), a = []; for (let i = 0; i < tg.count; i++) a.push(u32(o + i * 8) / (u32(o + i * 8 + 4) || 1)); return a; };
  const out = {};
  const ifd0 = ifd(u32(4));

}

}
function addPhotos(list) {

}
/* 파일(갤러리·휴대폰 기본 카메라) → 16:9·50KB 사진 */

}
async function handleFiles(files, source) {

    setStatus(`사진 처리 중 ${i + 1}/${arr.length}…`, '');
    try { added.push(await processFile(arr[i], source)); } catch (e) { fails.push(e.message); }
  }
  addPhotos(added);
  const noLoc = added.filter(p => p.lat == null && p.locSrc !== 'pending').length;
  setStatus(`사진 ${added.length}장 추가${noLoc ? ` · 위치정보 없는 사진 ${noLoc}장` : ''}${fails.length ? ` · 실패 ${fails.length}장` : ''}`, fails.length ? 'err' : 'ok');
  if (fails.length) console.warn(fails.join('\n'));
  if (currentTab === 'photos') renderAll();
}

/* 화면이 아직 안 나왔으면 최대 1.5초 기다렸다가 촬영 (누른 순간을 놓치지 않게) */

/* 이전 버전(비목/금액 칸)으로 저장된 문서를 새 사내 양식 칸으로 옮김 */
function migrate(d) {
  const base = defaultDoc();
  const out = Object.assign(base, d);
  out.common = Object.assign(defaultDoc().common, d && d.common);
  out.exp = Object.assign(defaultDoc().exp, d && d.exp);
  /* 환율: 예전엔 집행내역서(exp.rate) → 공통(common.rate, 엔 고정) → 지금은 통화별(common.rates) */
  const oldRate = (d && d.common && d.common.rate != null) ? d.common.rate : (d && d.exp && d.exp.rate != null ? d.exp.rate : null);
  if (!(d && d.common && d.common.rates)) {
    out.common.currency = (d && d.common && d.common.currency) || detectCurrency(out.common.dest) || 'JPY';
    out.common.rates = {};
    if (oldRate != null) out.common.rates.JPY = oldRate;           // 예전 환율은 엔화 기준이었음
    else out.common.rates = defaultDoc().common.rates;
  }
  delete out.common.rate; delete out.exp.rate;
  /* 결제수단: 예전 카드번호 1개 → 목록. 행에서 쓰던 결제수단도 빠짐없이 넣음 */
  if (!(d && d.common && Array.isArray(d.common.payMethods))) {
    const list = [];
    const add = m => { if (m && !list.includes(m)) list.push(m); };
    add(d && d.common && d.common.cardNo);
    defaultDoc().common.payMethods.forEach(add);   // 기본 법인카드·현금·계좌이체는 항상 포함
    ((d && d.exp && d.exp.rows) || []).forEach(r => add(r.pay));
    out.common.payMethods = list;
  }
  delete out.common.cardNo;
  out.photos = (d && Array.isArray(d.photos)) ? d.photos : [];
  /* 이전 일정(장소 한 칸) → 이동/장소 구분. "A → B" 형태면 이동으로 나눔 */
  out.plan = Object.assign(defaultDoc().plan, d && d.plan);
  out.plan.schedule = (out.plan.schedule || []).map(s => {
    /* 장소 한 칸(place) → 지역/건물. "나고야 강의장"처럼 띄어쓰기가 있으면 첫 단어를 지역으로 */
    const splitPlace = p => {
      p = String(p || '').trim();
      const m = p.match(/^(\S+)\s+(.+)$/);
      return (m && !/[\/·,]/.test(p)) ? { area: m[1], bldg: m[2] } : { area: '', bldg: p };
    };
    if (s.mode) {
      if (s.area == null && s.bldg == null) Object.assign(s, splitPlace(s.place));
      delete s.place;
      return s;
    }
    const parts = String(s.place || '').split(/\s*(?:→|->|>)\s*/);
    return parts.length === 2 && parts[0] && parts[1]
      ? { date: s.date, mode: 'move', from: parts[0], to: parts[1], area: '', bldg: '', content: s.content || '' }
      : Object.assign({ date: s.date, mode: 'stay', from: '', to: '', content: s.content || '' }, splitPlace(s.place));
  });
  out.exp.rows = (out.exp.rows || []).map((r, i) => ('amount' in r) ? { no: i + 1, date: r.date, pay: '', region: '국내', store: r.payee || '', fx: '', krw: r.amount, payDate: '', item: r.item || r.cat || '', scope: '과제', note: r.proof || '' } : r);
  /* 외화 칸 이름 jpy → fx */
  out.exp.rows.forEach(r => { if ('jpy' in r) { if (r.fx == null || r.fx === '') r.fx = r.jpy; delete r.jpy; } if (r.fx == null) r.fx = ''; });
  /* 소요예산이 없던 문서 → 예전처럼 집행내역서 기준 금액으로 채움 */
  if (!(d && d.plan && Array.isArray(d.plan.budget))) {
    out.plan.budget = budgetFromExp(out.exp.rows, n0((out.common.rates || {})[out.common.currency || 'JPY']));
  }
  return out;
}

    lsSet('members_cache', JSON.stringify(members));
  } else if (!members.length) {
    /* 처음: 지금 문서의 출장자를 멤버로 채워 둠 (저장은 설정에서 고칠 때) */
    members = (doc.common.travelers || []).filter(t => t.name).map(t => ({ name: t.name, dept: t.dept || '', pos: t.pos || '', role: t.role || '', memo: '' }));
  }
  if (currentTab === 'settings' || currentTab === 'common') renderAll();
}
function setMemberMsg(t) { const el = $('#memberSaved'); if (el) el.textContent = t; }
function saveMembersSoon() {
  lsSet('members_cache', JSON.stringify(members));
  setMemberMsg('저장 중…');
  clearTimeout(memberTimer); memberTimer = setTimeout(saveMembers, 600);
}
async function saveMembers() {
  if (!sb) { setMemberMsg('이 기기에만 저장됨 (Supabase 미연결)'); return; }
  const row = { title: MEMBERS_TITLE, data: { members }, updated_at: new Date().toISOString() };
  const r = membersRowId
    ? await sb.from(TABLE).update(row).eq('id', membersRowId).select('id').single()
    : await sb.from(TABLE).insert(row).select('id').single();
  if (r.error) { setMemberMsg('Supabase 저장 실패 — 이 기기에는 보관됨 (' + r.error.message + ')'); return; }
  membersRowId = r.data.id; setMemberMsg('저장됨');
}
function membersEditorHtml() {
  return `<h2>멤버 관리</h2>
    <p class="note">자주 함께 출장 가는 사람을 등록해 두면 [공통 정보]의 <b>작성자</b>·<b>출장자</b>에서 골라 넣을 수 있습니다. 바꾸면 자동 저장됩니다. <span id="memberSaved" class="status"></span></p>
    <table class="grid-edit"><tr><th>이름</th><th>소속</th><th>직위</th><th>과제 내 역할</th><th>메모(연락처 등)</th><th style="width:28px"></th></tr>
      ${members.map((m, i) => `<tr>
        <td><input data-member-i="${i}" data-member-k="name" value="${esc(m.name)}" placeholder="이름"></td>
        <td><input data-member-i="${i}" data-member-k="dept" value="${esc(m.dept)}" placeholder="예: 품질관리팀"></td>
        <td><input data-member-i="${i}" data-member-k="pos" value="${esc(m.pos)}" placeholder="예: 팀장"></td>
        <td><input data-member-i="${i}" data-member-k="role" value="${esc(m.role)}" placeholder="예: 참여연구원"></td>
        <td><input data-member-i="${i}" data-member-k="memo" value="${esc(m.memo)}"></td>
        <td><button class="del" data-member-del="${i}" title="삭제">×</button></td></tr>`).join('') || '<tr><td colspan="6" class="note" style="padding:8px">등록된 멤버가 없습니다.</td></tr>'}
    </table>
    <button data-member-add="1" style="margin-top:6px">+ 멤버 추가</button>`;
}
/* 멤버 입력 */
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || t.dataset.memberI == null) return;
  members[+t.dataset.memberI][t.dataset.memberK] = t.value; saveMembersSoon();
});
/* 공통 정보: 멤버에서 작성자 / 출장자 고르기 */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pickWriter' && t.value !== '') {
    const m = members[+t.value];
    Object.assign(doc.common, { writer: m.name || '', writerTitle: m.pos || '', writerDept: m.dept || '' });
    markDirty(); renderAll(); setStatus(`작성자: ${memberLabel(m)}`, 'ok');
  }
  if (t.id === 'pickTraveler' && t.value !== '') {
    const m = members[+t.value];
    const tr = doc.common.travelers;
    if (tr.some(x => x.name === m.name)) { setStatus(`${m.name}은(는) 이미 출장자에 있습니다`, ''); t.value = ''; return; }
    const blank = tr.findIndex(x => !x.name && !x.dept && !x.pos);
    const row = { name: m.name || '', dept: m.dept || '', pos: m.pos || '', role: m.role || '' };
    if (blank > -1) tr[blank] = row; else tr.push(row);
    markDirty(); renderAll(); setStatus(`출장자 추가: ${memberLabel(m)}`, 'ok');
  }
});

/* ---------------- Supabase CRUD ---------------- */
let listCache = [];
async function refreshList() {
  if (!sb) { setStatus('Supabase 미연결 (설정 확인)', 'err'); return; }
  const { data, error } = await sb.from(TABLE).select('id,title,updated_at').order('updated_at', { ascending: false });
  if (error) { setStatus('연결 오류: ' + error.message, 'err'); return; }
  listCache = (data || []).filter(r => r.title !== MEMBERS_TITLE);   // 멤버 목록 행은 문서 목록에서 숨김
  $('#docList').innerHTML = '<option value="">(새 문서)</option>' + listCache.map(r => `<option value="${r.id}">${esc(r.title)} · ${new Date(r.updated_at).toLocaleString('ko-KR')}</option>`).join('');
  syncListSel();
  setStatus(`Supabase 연결됨 · 문서 ${listCache.length}건`, 'ok');
}
function syncListSel() { $('#docList').value = currentId || ''; }

$('#docList').addEventListener('change', async e => {
  const id = e.target.value;
  if (!id) { doc = defaultDoc(); currentId = null; renderAll(); return; }
  const { data, error } = await sb.from(TABLE).select('*').eq('id', id).single();
  if (error) { setStatus('불러오기 오류: ' + error.message, 'err'); return; }
  doc = migrate(data.data); doc.title = data.title; currentId = data.id; dirty = false;
  renderAll(); setStatus('불러옴: ' + data.title, 'ok');
});
/* 새 출장 문서: 과제·작성자·출장자·결제수단·환율은 지금 문서에서 이어받고, 출장별 내용은 비움 */
function newTripDoc(prev) {
  const d = defaultDoc();
  const t = new Date();
  const today = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  if (prev && prev.common) {
    ['bizName', 'projNo', 'projName', 'org', 'pi', 'piTitle', 'writer', 'writerTitle', 'writerDept', 'currency']
      .forEach(k => { if (prev.common[k] != null) d.common[k] = prev.common[k]; });
    d.common.travelers = JSON.parse(JSON.stringify(prev.common.travelers || d.common.travelers));
    d.common.payMethods = (prev.common.payMethods || d.common.payMethods).slice();
    d.common.rates = Object.assign({}, prev.common.rates || d.common.rates);
  }
  d.title = '새 출장';
  Object.assign(d.common, { draftDate: today, dest: '', start: '', end: '', purpose: '', visit: '' });
  d.gian.subject = '글로벌 강소기업 R&D 과제 해외출장 기안의 건';
  d.gian.content = '';
  d.plan.schedule = [{ date: '', mode: 'move', from: '인천', to: '', area: '', bldg: '', content: '' }];
  d.plan.budget = [
    { item: '항공료', basis: '', region: '국내', fx: '', krw: '' },
    { item: '출장 개인여비', basis: '', region: '국내', fx: '', krw: '' }
  ];
  d.exp = { purpose: '', region: '', travelersText: d.common.travelers.map(x => x.name).filter(Boolean).join(', '), rows: [], note: '' };
  d.report = { daily: [], findings: '', apply: '', next: '' };
  return d;
}
$('#btnNew').addEventListener('click', () => {
  if (dirty && !confirm('저장하지 않은 변경 내용이 있습니다. 새 문서를 만들까요?\n(지금 내용은 이 브라우저 임시 저장분에서도 사라집니다)')) return;
  doc = newTripDoc(doc); currentId = null; editingPlace = null; curAutoMsg = '';
  markDirty(); dirty = false; currentTab = 'common'; renderAll(); syncListSel();
  setStatus('새 문서 (저장 전) — 과제·작성자·결제수단·환율은 이어받았습니다', '');
});
$('#btnReload').addEventListener('click', refreshList);
$('#btnSave').addEventListener('click', async () => {
  if (!sb) { setStatus('Supabase 미연결 (설정 확인)', 'err'); return; }
  const t = prompt('문서 이름', doc.title || ''); if (t === null) return;
  doc.title = t.trim() || doc.title;
  const row = { title: doc.title, data: doc, updated_at: new Date().toISOString() };
  const q = currentId ? sb.from(TABLE).update(row).eq('id', currentId).select().single() : sb.from(TABLE).insert(row).select().single();
  const { data, error } = await q;
  if (error) { setStatus('저장 오류: ' + error.message, 'err'); return; }
  currentId = data.id; dirty = false; await refreshList(); setStatus('저장됨: ' + doc.title, 'ok');
});
$('#btnDelete').addEventListener('click', async () => {
  if (!sb || !currentId) { setStatus('삭제할 저장 문서를 먼저 선택하세요', 'err'); return; }
  if (!confirm(`'${doc.title}' 문서를 Supabase에서 삭제할까요? 되돌릴 수 없습니다.`)) return;
  const { error } = await sb.from(TABLE).delete().eq('id', currentId);
  if (error) { setStatus('삭제 오류: ' + error.message, 'err'); return; }
  currentId = null; doc = defaultDoc(); renderAll(); await refreshList(); setStatus('삭제됨', 'ok');
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------------- 시작 ---------------- */
(function start() {
  try {
    const draft = JSON.parse(lsGet(DRAFT_KEY, 'null'));
    if (draft && draft.doc) { doc = migrate(draft.doc); currentId = draft.id || null; }
  } catch (e) {}
  initSupabase();
  renderAll();
  refreshList();
  loadMembers();
  /* 휴대폰 오프라인용: https(또는 localhost)에서는 화면 파일을 기기에 저장해 둠 */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
